name: Build and Publish Package

on:
  push:
    branches: [ master ]
    paths:
      - '**/PKGBUILD'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    container: archlinux:latest 
    
    steps:
      - name: Install Git
        run: pacman -Sy --noconfirm git

      - name: Checkout PKGBUILD repository
        uses: actions/checkout@v4
        
      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm base-devel
          
      - name: Build the package
        run: |
          PKG_DIR=$(find . -name "PKGBUILD" -exec dirname {} \; | head -n 1)
          
          if [ -z "$PKG_DIR" ] || [ "$PKG_DIR" = "." ]; then
            exit 1
          fi
          
          cd "$PKG_DIR"
          
          useradd -m builder
          chown -R builder:builder .
          
          su builder -c "makepkg -s --noconfirm"
          
      - name: Checkout Binary Repository
        uses: actions/checkout@v4
        with:
          repository: LunarisDotSh/lunaris-arch-repo
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          path: lunaris-arch-repo
          
      - name: Publish to Binary Repository
        run: |
            # Format date
            date_format="$(date +"%Y-%m-%d %H:%M")"

            cd lunaris-arch-repo

            find .. -name "*.pkg.tar.zst" -exec cp {} . \;

            # Create database
            repo-add -n -R lunaris-arch-repo.db.tar.gz *.pkg.tar.zst

            # Fix synlinks
            rm -f lunaris-arch-repo.db lunaris-arch-repo.files
            mv lunaris-arch-repo.db.tar.gz lunaris-arch-repo.db
            mv lunaris-arch-repo.files.tar.gz lunaris-arch-repo.files

            # Git identity
            git config --global user.name "Lunaris Builder"
            git config --global user.email "builder@lunaris.sh"

            # Add changed files
            git add -A
            git diff --cached --quiet && exit 0

            # Push changes
            git commit -m "chore(repo): update database: $date_format" || exit 0
            git push
