name: Build and Publish Package

on:
  push:
    branches: [master]
    paths:
      - "**/PKGBUILD"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install Git
        run: pacman -Sy --noconfirm git --needed
        
      - name: Checkout PKGBUILD repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changed PKGBUILDs
        id: check
        run: |
          # Check if HEAD^ exists
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^ HEAD | grep '/PKGBUILD$' || true)
          else
            # First commit, treat all PKGBUILDs as changed
            CHANGED=$(find . -name "PKGBUILD" | sed 's|^\./||' || true)
          fi
          
          if [ -z "$CHANGED" ]; then
            echo "No PKGBUILDs changed."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            # Extract directories and format the loop
            DIRS=$(echo "$CHANGED" | xargs -n1 dirname | sort -u | tr '\n' ' ')
            echo "dirs=$DIRS" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Install build dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          pacman -Syy --noconfirm archlinux-keyring
          pacman -Sy --noconfirm --needed base-devel sudo

      - name: Build packages
        run: |
          # Create builder user and set permissions
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          echo "Defaults lecture = never" >> /etc/sudoers
          echo 'PACKAGER="${{ vars.PACKAGER_VALUE }}"' >> /etc/makepkg.conf
          chown -R builder:builder $GITHUB_WORKSPACE

          # Build packages
          for pkg in ${{ steps.check.outputs.dirs }}; do
            sudo -u builder bash -c "cd \"$pkg\" && makepkg -d --noconfirm"
          done

        shell: bash

      - name: Checkout Binary Repository
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: LunarisDotSh/lunaris-arch-repo
          token: ${{ secrets.REPO_PAT }}
          path: lunaris-arch-repo

      - name: Publish to Binary Repository
        if: steps.check.outputs.skip != 'true'
        run: |
          # Format date
          date_format="$(date +"%Y-%m-%d %H:%M")"

          # Create arch directory
          cd lunaris-arch-repo
          mkdir -p x86_64

          # Find builded packages
          find .. -name "*.pkg.tar.zst" -exec cp {} x86_64/ \;

          # Create database
          cd x86_64
          repo-add -n -R lunaris.db.tar.gz *.pkg.tar.zst

          # Fix synlinks
          rm -f lunaris.db lunaris.files
          mv lunaris.db.tar.gz lunaris.db
          mv lunaris.files.tar.gz lunaris.files

          cd ..

          # Git identity
          git config --global user.name "Lunaris Builder"
          git config --global user.email "builder@lunaris.sh"

          # Add changed files
          git add -A
          git diff --cached --quiet && exit 0

          # Push changes
          git commit -m "chore(repo): update database: $date_format" || exit 0
          git push
