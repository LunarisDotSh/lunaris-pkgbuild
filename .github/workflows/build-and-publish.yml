name: Build and Publish Package

on:
  push:
    branches: [master]
    paths:
      - "**/PKGBUILD"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Checkout PKGBUILD repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install build dependencies
        run: |
          pacman -Syy --noconfirm archlinux-keyring
          pacman -Sy --noconfirm --needed base-devel git sudo

      - name: Build packages
        run: |
          # Create builder user and set permissions
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          echo "Defaults lecture = never" >> /etc/sudoers
          echo 'PACKAGER="${{ vars.PACKAGER_VALUE }}"' >> /etc/makepkg.conf
          chown -R builder:builder $GITHUB_WORKSPACE

          # Find directories where a PKGBUILD was added or modified
          PKG_DIRS=$(git diff --name-only HEAD^ HEAD | grep '/PKGBUILD$' | xargs -n1 dirname | sort -u)

          # Exit safeguard
          [ -z "$PKG_DIRS" ] && exit 0

          # Build packages
          for pkg in "${PKG_DIRS[@]}"; do
            sudo -u builder bash -c "cd \"$pkg\" && makepkg -d --noconfirm"
          done

        shell: bash

      - name: Checkout Binary Repository
        uses: actions/checkout@v4
        with:
          repository: LunarisDotSh/lunaris-arch-repo
          token: ${{ secrets.REPO_PAT }}
          path: lunaris-arch-repo

      - name: Publish to Binary Repository
        run: |
          # Format date
          date_format="$(date +"%Y-%m-%d %H:%M")"

          # Create arch directory
          cd lunaris-arch-repo
          mkdir -p x86_64

          # Find builded packages
          find .. -name "*.pkg.tar.zst" -exec cp {} x86_64/ \;

          # Create database
          cd x86_64
          repo-add -n -R lunaris.db.tar.gz *.pkg.tar.zst

          # Fix synlinks
          rm -f lunaris.db lunaris.files
          mv lunaris.db.tar.gz lunaris.db
          mv lunaris.files.tar.gz lunaris.files

          cd ..

          # Git identity
          git config --global user.name "Lunaris Builder"
          git config --global user.email "builder@lunaris.sh"

          # Add changed files
          git add -A
          git diff --cached --quiet && exit 0

          # Push changes
          git commit -m "chore(repo): update database: $date_format" || exit 0
          git push
